# Release builds: push a tag like v0.1.0 and .github/workflows/release.yml
# runs GoReleaser, which attaches these archives to the GitHub release.
version: 2
project_name: jevcc
builds:
  - main: ./cmd/jevcc
    binary: jevcc
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Tag}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
